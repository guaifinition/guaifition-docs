<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="780" viewBox="0 0 1300 780">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}</style>
<text x="650" y="40" text-anchor="middle" font-size="25" font-weight="700">Ultra-like multi-agent execution topology</text>
<rect x="490" y="80" width="320" height="130" rx="12" fill="#f7f7f7" stroke="#333" stroke-width="2"/>
<text x="650.0" y="108" text-anchor="middle" font-size="16" font-weight="700">Root agent</text>
<text x="650.0" y="130" text-anchor="middle" font-size="12">Decomposes work, spawns</text>
<text x="650.0" y="148" text-anchor="middle" font-size="12">subagents, sends messages,</text>
<text x="650.0" y="166" text-anchor="middle" font-size="12">waits, and synthesizes</text>
<rect x="60" y="330" width="250" height="150" rx="12" fill="#f7f7f7" stroke="#333" stroke-width="2"/>
<text x="185.0" y="358" text-anchor="middle" font-size="16" font-weight="700">Subagent A</text>
<text x="185.0" y="380" text-anchor="middle" font-size="12">Independent research stream</text>
<line x1="650" y1="210" x2="185" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="417.5" y="262.0" text-anchor="middle" font-size="11">spawn / message</text>
<line x1="185" y1="480" x2="650" y2="560" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="417.5" y="512.0" text-anchor="middle" font-size="11">result</text>
<rect x="350" y="330" width="250" height="150" rx="12" fill="#f7f7f7" stroke="#333" stroke-width="2"/>
<text x="475.0" y="358" text-anchor="middle" font-size="16" font-weight="700">Subagent B</text>
<text x="475.0" y="380" text-anchor="middle" font-size="12">Alternative hypothesis /</text>
<text x="475.0" y="398" text-anchor="middle" font-size="12">implementation</text>
<line x1="650" y1="210" x2="475" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="562.5" y="262.0" text-anchor="middle" font-size="11">spawn / message</text>
<line x1="475" y1="480" x2="650" y2="560" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="562.5" y="512.0" text-anchor="middle" font-size="11">result</text>
<rect x="640" y="330" width="250" height="150" rx="12" fill="#f7f7f7" stroke="#333" stroke-width="2"/>
<text x="765.0" y="358" text-anchor="middle" font-size="16" font-weight="700">Subagent C</text>
<text x="765.0" y="380" text-anchor="middle" font-size="12">Verification / tests</text>
<line x1="650" y1="210" x2="765" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="707.5" y="262.0" text-anchor="middle" font-size="11">spawn / message</text>
<line x1="765" y1="480" x2="650" y2="560" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="707.5" y="512.0" text-anchor="middle" font-size="11">result</text>
<rect x="930" y="330" width="250" height="150" rx="12" fill="#f7f7f7" stroke="#333" stroke-width="2"/>
<text x="1055.0" y="358" text-anchor="middle" font-size="16" font-weight="700">Subagent D</text>
<text x="1055.0" y="380" text-anchor="middle" font-size="12">Risk and contradiction review</text>
<line x1="650" y1="210" x2="1055" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="852.5" y="262.0" text-anchor="middle" font-size="11">spawn / message</text>
<line x1="1055" y1="480" x2="650" y2="560" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="852.5" y="512.0" text-anchor="middle" font-size="11">result</text>
<rect x="490" y="560" width="320" height="130" rx="12" fill="#f7f7f7" stroke="#333" stroke-width="2"/>
<text x="650.0" y="588" text-anchor="middle" font-size="16" font-weight="700">Root synthesis</text>
<text x="650.0" y="610" text-anchor="middle" font-size="12">Reconcile conflicts, remove</text>
<text x="650.0" y="628" text-anchor="middle" font-size="12">duplicates, produce one final</text>
<text x="650.0" y="646" text-anchor="middle" font-size="12">response</text>
<text x="650" y="735" text-anchor="middle" font-size="13">OpenAI states that Ultra uses four agents by default; API multi-agent can configure concurrency and may form a tree.</text></svg>