<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}</style>
<text x="600" y="40" text-anchor="middle" font-size="25" font-weight="700">Three independent control axes in GPT-5.6</text>
<rect x="70" y="90" width="300" height="145" rx="12" fill="#eef4ff" stroke="#333" stroke-width="2"/>
<text x="220.0" y="118" text-anchor="middle" font-size="16" font-weight="700">1. Model tier</text>
<text x="220.0" y="140" text-anchor="middle" font-size="12">Sol / Terra / Luna Changes</text>
<text x="220.0" y="158" text-anchor="middle" font-size="12">capability-cost frontier</text>
<rect x="450" y="90" width="300" height="145" rx="12" fill="#f4f1ff" stroke="#333" stroke-width="2"/>
<text x="600.0" y="118" text-anchor="middle" font-size="16" font-weight="700">2. Reasoning effort</text>
<text x="600.0" y="140" text-anchor="middle" font-size="12">none / low / medium / high /</text>
<text x="600.0" y="158" text-anchor="middle" font-size="12">xhigh / max Controls single-</text>
<text x="600.0" y="176" text-anchor="middle" font-size="12">agent thinking</text>
<rect x="830" y="90" width="300" height="145" rx="12" fill="#f1fff5" stroke="#333" stroke-width="2"/>
<text x="980.0" y="118" text-anchor="middle" font-size="16" font-weight="700">3. Execution mode</text>
<text x="980.0" y="140" text-anchor="middle" font-size="12">standard / pro / multi-agent</text>
<text x="980.0" y="158" text-anchor="middle" font-size="12">(ultra-like) Changes</text>
<text x="980.0" y="176" text-anchor="middle" font-size="12">orchestration topology</text>
<line x1="220" y1="235" x2="220" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="600" y1="235" x2="600" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="980" y1="235" x2="980" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="70" y="330" width="300" height="180" rx="12" fill="#f7f7f7" stroke="#333" stroke-width="2"/>
<text x="220.0" y="358" text-anchor="middle" font-size="16" font-weight="700">Capacity plane</text>
<text x="220.0" y="380" text-anchor="middle" font-size="12">Different weights/checkpoints or</text>
<text x="220.0" y="398" text-anchor="middle" font-size="12">serving tier. Parameter counts</text>
<text x="220.0" y="416" text-anchor="middle" font-size="12">and physical architecture are</text>
<rect x="450" y="330" width="300" height="180" rx="12" fill="#f7f7f7" stroke="#333" stroke-width="2"/>
<text x="600.0" y="358" text-anchor="middle" font-size="16" font-weight="700">Compute-allocation plane</text>
<text x="600.0" y="380" text-anchor="middle" font-size="12">Adaptive internal reasoning</text>
<text x="600.0" y="398" text-anchor="middle" font-size="12">tokens, planning, verification,</text>
<text x="600.0" y="416" text-anchor="middle" font-size="12">and tool-use depth.</text>
<rect x="830" y="330" width="300" height="180" rx="12" fill="#f7f7f7" stroke="#333" stroke-width="2"/>
<text x="980.0" y="358" text-anchor="middle" font-size="16" font-weight="700">Orchestration plane</text>
<text x="980.0" y="380" text-anchor="middle" font-size="12">One model run, more hidden model</text>
<text x="980.0" y="398" text-anchor="middle" font-size="12">work, or root agent plus</text>
<text x="980.0" y="416" text-anchor="middle" font-size="12">parallel subagents.</text>
<text x="600" y="575" text-anchor="middle" font-size="15" font-weight="700">Do not read “Sol → max → ultra” as one linear scale.</text></svg>