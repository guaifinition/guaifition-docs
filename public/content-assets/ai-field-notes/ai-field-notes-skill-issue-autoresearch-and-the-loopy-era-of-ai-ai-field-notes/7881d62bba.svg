<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
<defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#4b5563"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfbfc"/>
<text x="50" y="50" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="30" font-weight="700" fill="#111827">AutoResearch experiment loop</text>
<text x="50" y="80" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="17" fill="#4b5563">Verified against the public autoresearch repository: fixed environment, editable train.py, five-minute trials, keep/revert.</text>
<line x1="250" y1="205.0" x2="305" y2="205.0" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
<text x="277.5" y="197.0" text-anchor="middle" font-family="Cascadia Code, monospace" font-size="13" fill="#374151">instructions</text>
<line x1="495" y1="205.0" x2="550" y2="205.0" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
<text x="522.5" y="197.0" text-anchor="middle" font-family="Cascadia Code, monospace" font-size="13" fill="#374151">commit</text>
<line x1="740" y1="205.0" x2="795" y2="205.0" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
<text x="767.5" y="197.0" text-anchor="middle" font-family="Cascadia Code, monospace" font-size="13" fill="#374151">run.log</text>
<line x1="985" y1="205.0" x2="1040" y2="205.0" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1012.5" y="197.0" text-anchor="middle" font-family="Cascadia Code, monospace" font-size="13" fill="#374151">metric</text>
<line x1="1175" y1="205.0" x2="305" y2="205.0" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
<text x="740.0" y="197.0" text-anchor="middle" font-family="Cascadia Code, monospace" font-size="13" fill="#374151">iterate</text>
<rect x="45" y="145" width="205" height="120" rx="14" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<text x="147.5" y="181" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="20" font-weight="700" fill="#111827">program.md</text>
<text x="147.5" y="207" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="14" fill="#4b5563">Human-authored</text>
<text x="147.5" y="227" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="14" fill="#4b5563">research policy</text>
<text x="147.5" y="247" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="14" fill="#4b5563">and context</text>
<rect x="305" y="145" width="190" height="120" rx="14" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<text x="400.0" y="181" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="20" font-weight="700" fill="#111827">Edit train.py</text>
<text x="400.0" y="207" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="14" fill="#4b5563">Architecture,</text>
<text x="400.0" y="227" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="14" fill="#4b5563">optimizer and</text>
<text x="400.0" y="247" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="14" fill="#4b5563">hyperparameters</text>
<rect x="550" y="145" width="190" height="120" rx="14" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<text x="645.0" y="181" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="20" font-weight="700" fill="#111827">Train 5 min</text>
<text x="645.0" y="207" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="14" fill="#4b5563">Fixed wall-clock</text>
<text x="645.0" y="227" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="14" fill="#4b5563">budget on one</text>
<text x="645.0" y="247" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="14" fill="#4b5563">GPU</text>
<rect x="795" y="145" width="190" height="120" rx="14" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<text x="890.0" y="181" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="20" font-weight="700" fill="#111827">Evaluate</text>
<text x="890.0" y="207" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="14" fill="#4b5563">val_bpb; lower</text>
<text x="890.0" y="227" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="14" fill="#4b5563">is better</text>
<rect x="1040" y="145" width="135" height="120" rx="14" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<text x="1107.5" y="181" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="20" font-weight="700" fill="#111827">Decide</text>
<text x="1107.5" y="207" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="14" fill="#4b5563">Keep, discard or</text>
<text x="1107.5" y="227" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="14" fill="#4b5563">crash</text>
</svg>