<text x="805.0" y="171" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="20" font-weight="700" fill="#111827">Experiment stream</text>
<text x="805.0" y="197" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="14" fill="#4b5563">Hypotheses,</text>
