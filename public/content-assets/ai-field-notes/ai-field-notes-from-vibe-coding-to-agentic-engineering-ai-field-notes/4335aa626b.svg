<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#4b5563"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfbfc"/>
<text x="50" y="50" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="30" font-weight="700" fill="#111827">Agentic engineering control loop</text>
<text x="50" y="80" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="17" fill="#4b5563">The critical shift is from emitting code to controlling a verified execution loop.</text>
<line x1="280" y1="187.5" x2="350" y2="187.5" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
<text x="315.0" y="179.5" text-anchor="middle" font-family="Cascadia Code, monospace" font-size="13" fill="#374151">task</text>
<line x1="560" y1="187.5" x2="630" y2="187.5" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
<text x="595.0" y="179.5" text-anchor="middle" font-family="Cascadia Code, monospace" font-size="13" fill="#374151">artifacts</text>
<line x1="840" y1="187.5" x2="910" y2="187.5" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
<text x="875.0" y="179.5" text-anchor="middle" font-family="Cascadia Code, monospace" font-size="13" fill="#374151">approved</text>
<rect x="70" y="130" width="210" height="115" rx="14" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<text x="175.0" y="166" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="20" font-weight="700" fill="#111827">Specify</text>
<text x="175.0" y="192" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="14" fill="#4b5563">Problem,</text>
<text x="175.0" y="212" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="14" fill="#4b5563">boundaries,</text>
<text x="175.0" y="232" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="14" fill="#4b5563">definition of</text>
<text x="175.0" y="252" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="14" fill="#4b5563">done</text>
<rect x="350" y="130" width="210" height="115" rx="14" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<text x="455.0" y="166" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="20" font-weight="700" fill="#111827">Delegate</text>
<text x="455.0" y="192" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="14" fill="#4b5563">Agent plan, tools</text>
<text x="455.0" y="212" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="14" fill="#4b5563">and sub-tasks</text>
<rect x="630" y="130" width="210" height="115" rx="14" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<text x="735.0" y="166" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="20" font-weight="700" fill="#111827">Verify</text>
<text x="735.0" y="192" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="14" fill="#4b5563">Tests, review,</text>
<text x="735.0" y="212" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="14" fill="#4b5563">security and</text>
<text x="735.0" y="232" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="14" fill="#4b5563">evidence</text>
<rect x="910" y="130" width="210" height="115" rx="14" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<text x="1015.0" y="166" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="20" font-weight="700" fill="#111827">Integrate</text>
<text x="1015.0" y="192" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="14" fill="#4b5563">Merge, deploy,</text>
<text x="1015.0" y="212" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="14" fill="#4b5563">observe and</text>
<text x="1015.0" y="232" text-anchor="middle" font-family="Times New Roman, HarmonyOS Sans SC, serif" font-size="14" fill="#4b5563">revise</text>
</svg>