<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="system-ui, 'Noto Sans SC', 'Microsoft YaHei', sans-serif" role="img" aria-label="演示演进：从会撒谎的裸循环到能真正登录点赞的 harness"><rect width="900" height="430" fill="#ffffff"/><defs><marker id="ev-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#72757a"/></marker></defs><text x="40" y="34" font-size="16" font-weight="700" fill="#202123">演示演进 · 提示词一字未改，只逐步加 harness</text><text x="40" y="56" font-size="12" fill="#72757a">GPT-3.5 Turbo · 目标：给 Hacker News 首帖点赞（prompt 全程不变）</text><rect x="40.0" y="92" width="148.0" height="250" rx="11" fill="#fff5e2" stroke="#a46108" stroke-width="1.5"/><circle cx="64.0" cy="118" r="13" fill="#a46108"/><text x="64.0" y="123" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">①</text><text x="114.0" y="162" font-size="12.5" font-weight="700" fill="#202123" text-anchor="middle">裸 agent loop</text><rect x="56.0" y="184" width="116.0" height="30" rx="8" fill="#ffffff" stroke="#a46108" stroke-width="1.2"/><text x="114.0" y="204" font-size="12" font-weight="700" fill="#a46108" text-anchor="middle">崩溃 + 撒谎</text><text x="114.0" y="242" font-size="10.5" fill="#4b4d50" text-anchor="middle">点了按钮就自认成功</text><path d="M 190.0 217.0 l 16 0" stroke="#72757a" stroke-width="1.8" marker-end="url(#ev-arrow)"/><rect x="208.0" y="92" width="148.0" height="250" rx="11" fill="#fff5e2" stroke="#a46108" stroke-width="1.5"/><circle cx="232.0" cy="118" r="13" fill="#a46108"/><text x="232.0" y="123" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">②</text><text x="282.0" y="162" font-size="12.5" font-weight="700" fill="#202123" text-anchor="middle">+ 护栏 / 压缩</text><rect x="224.0" y="184" width="116.0" height="30" rx="8" fill="#ffffff" stroke="#a46108" stroke-width="1.2"/><text x="282.0" y="204" font-size="12" font-weight="700" fill="#a46108" text-anchor="middle">受控但仍失败</text><text x="282.0" y="242" font-size="10.5" fill="#4b4d50" text-anchor="middle">max 6 步 · 简陋压缩</text><path d="M 358.0 217.0 l 16 0" stroke="#72757a" stroke-width="1.8" marker-end="url(#ev-arrow)"/><rect x="376.0" y="92" width="148.0" height="250" rx="11" fill="#f2f2f0" stroke="#72757a" stroke-width="1.5"/><circle cx="400.0" cy="118" r="13" fill="#72757a"/><text x="400.0" y="123" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">③</text><text x="450.0" y="162" font-size="12.5" font-weight="700" fill="#202123" text-anchor="middle">+ harness 抽象</text><rect x="392.0" y="184" width="116.0" height="30" rx="8" fill="#ffffff" stroke="#72757a" stroke-width="1.2"/><text x="450.0" y="204" font-size="12" font-weight="700" fill="#72757a" text-anchor="middle">入口 19 行</text><text x="450.0" y="242" font-size="10.5" fill="#4b4d50" text-anchor="middle">逻辑收进 run_harness</text><path d="M 526.0 217.0 l 16 0" stroke="#72757a" stroke-width="1.8" marker-end="url(#ev-arrow)"/><rect x="544.0" y="92" width="148.0" height="250" rx="11" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.5"/><circle cx="568.0" cy="118" r="13" fill="#2563eb"/><text x="568.0" y="123" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">④</text><text x="618.0" y="162" font-size="12.5" font-weight="700" fill="#202123" text-anchor="middle">+ 验证步骤</text><rect x="560.0" y="184" width="116.0" height="30" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/><text x="618.0" y="204" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">失败但不再撒谎</text><text x="618.0" y="242" font-size="10.5" fill="#4b4d50" text-anchor="middle">trace 核查真相</text><path d="M 694.0 217.0 l 16 0" stroke="#72757a" stroke-width="1.8" marker-end="url(#ev-arrow)"/><rect x="712.0" y="92" width="148.0" height="250" rx="11" fill="#eaf8f1" stroke="#13795b" stroke-width="1.5"/><circle cx="736.0" cy="118" r="13" fill="#13795b"/><text x="736.0" y="123" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">⑤</text><text x="786.0" y="162" font-size="12.5" font-weight="700" fill="#202123" text-anchor="middle">+ 登录处理器</text><rect x="728.0" y="184" width="116.0" height="30" rx="8" fill="#ffffff" stroke="#13795b" stroke-width="1.2"/><text x="786.0" y="204" font-size="12" font-weight="700" fill="#13795b" text-anchor="middle">成功点赞</text><text x="786.0" y="242" font-size="10.5" fill="#4b4d50" text-anchor="middle">harness 层确定性登录</text><rect x="40" y="360" width="820" height="40" rx="9" fill="#eaf8f1" stroke="#13795b" stroke-width="1.3"/><text x="450" y="385" font-size="12.5" fill="#202123" text-anchor="middle">结论：可靠性来自模型<tspan font-weight="700" fill="#13795b">外围的确定性外壳</tspan>，而不是把提示词“写得更用力”</text></svg>