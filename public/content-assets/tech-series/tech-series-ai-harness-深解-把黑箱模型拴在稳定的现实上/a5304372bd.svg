<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="system-ui, 'Noto Sans SC', 'Microsoft YaHei', sans-serif" role="img" aria-label="N+M 循环：外层 harness 重试循环包裹内层 agent 循环"><rect width="900" height="470" fill="#ffffff"/><defs><marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b4d50"/></marker></defs><text x="40" y="34" font-size="16" font-weight="700" fill="#202123">N+M 循环 · 外层 harness 包裹内层 agent loop</text><text x="40" y="56" font-size="12" fill="#72757a">run_harness（最多 3 次尝试）× run_agent_loop（最多 6 步）+ 每步注入的确定性钩子</text><rect x="40" y="78" width="820" height="356" rx="14" fill="none" stroke="#a46108" stroke-width="2"/><rect x="40" y="78" width="300" height="26" rx="13" fill="#fff5e2"/><text x="56" y="96" font-size="12.5" font-weight="700" fill="#a46108">run_harness — 外层 M 循环 · max_attempts = 3</text><rect x="70" y="128" width="500" height="278" rx="12" fill="none" stroke="#2563eb" stroke-width="2"/><rect x="70" y="128" width="330" height="26" rx="13" fill="#eaf2ff"/><text x="86" y="146" font-size="12.5" font-weight="700" fill="#2563eb">run_agent_loop — 内层 N 循环 · max_iterations = 6</text><rect x="215.0" y="178" width="210" height="40" rx="8" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.2"/><text x="320" y="203" font-size="12" fill="#202123" text-anchor="middle">Prompt · 上下文</text><rect x="215.0" y="238" width="210" height="40" rx="8" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.2"/><text x="320" y="263" font-size="12" fill="#202123" text-anchor="middle">LLM 生成响应</text><rect x="215.0" y="298" width="210" height="40" rx="8" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.2"/><text x="320" y="323" font-size="12" fill="#202123" text-anchor="middle">执行工具（Playwright）</text><rect x="215.0" y="358" width="210" height="40" rx="8" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.2"/><text x="320" y="383" font-size="12" fill="#202123" text-anchor="middle">事件压入 trace 历史</text><line x1="320" y1="218" x2="320" y2="238" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah-arrow)"/><line x1="320" y1="278" x2="320" y2="298" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah-arrow)"/><line x1="320" y1="338" x2="320" y2="358" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah-arrow)"/><path d="M 215.0 378.0 H 110 V 198.0 H 215.0" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-arrow)"/><text x="104" y="288.0" font-size="10.5" fill="#2563eb" text-anchor="middle" transform="rotate(-90 104 288.0)">while not stop</text><rect x="586" y="298" width="256" height="52" rx="9" fill="#eaf8f1" stroke="#13795b" stroke-width="1.4"/><text x="714" y="320" font-size="12" font-weight="700" fill="#13795b" text-anchor="middle">login_handler（每步前注入）</text><text x="714" y="338" font-size="10.5" fill="#4b4d50" text-anchor="middle">检测到登录页 → harness 层填凭据并提交</text><line x1="586" y1="324" x2="425.0" y2="318.0" stroke="#13795b" stroke-width="1.6" marker-end="url(#ah-arrow)"/><rect x="586" y="150" width="256" height="120" rx="10" fill="#f2edff" stroke="#6941c6" stroke-width="1.5"/><text x="714" y="176" font-size="12.5" font-weight="700" fill="#6941c6" text-anchor="middle">verify_step（确定性）</text><text x="714" y="200" font-size="11" fill="#4b4d50" text-anchor="middle">核查 trace：点赞是否真的成功？</text><text x="714" y="220" font-size="11" fill="#4b4d50" text-anchor="middle">未成功 → 判定失败（不采信自述）</text><text x="714" y="246" font-size="11" font-weight="700" fill="#13795b" text-anchor="middle">成功 → 返回</text><line x1="570" y1="200" x2="586" y2="200" stroke="#6941c6" stroke-width="1.6" marker-end="url(#ah-arrow)"/><path d="M 714 270 V 420 H 320 V 406" fill="none" stroke="#a46108" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-arrow)"/><rect x="602" y="410" width="228" height="20" rx="10" fill="#ffffff"/><text x="716" y="424" font-size="10.5" fill="#a46108" text-anchor="middle">失败且 attempts &lt; 3 → 重跑内层</text></svg>