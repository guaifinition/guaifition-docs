<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="system-ui, 'Noto Sans SC', 'Microsoft YaHei', sans-serif" role="img" aria-label="模型层级与推理强度是两个正交维度：中/高/极高都是同一个 GPT-5.6 Sol"><rect width="900" height="540" fill="#ffffff"/><defs><marker id="m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#13795b"/></marker></defs><text x="40" y="34" font-size="16" font-weight="700" fill="#202123">模型层级 × 推理强度是两个正交维度 · Model tier is not reasoning effort</text><text x="40" y="56" font-size="12" fill="#72757a">核心纠错：中 / 高 / 极高不是三个模型，而是同一个 GPT-5.6 Sol 的三档推理预设</text><text x="514.0" y="82" font-size="12.5" font-weight="700" fill="#2563eb" text-anchor="middle">推理强度 reasoning effort  →（越右越多思考）</text><text x="70" y="208" font-size="12.5" font-weight="700" fill="#6941c6" text-anchor="middle" transform="rotate(-90 70 208)">模型层级 model tier</text><rect x="112" y="92" width="126" height="96" rx="10" fill="#f2edff" stroke="#6941c6" stroke-width="1.6"/><text x="175" y="130" font-size="13.5" font-weight="700" fill="#6941c6" text-anchor="middle">GPT-5.6 Sol</text><text x="175" y="150" font-size="10.5" fill="#4b4d50" text-anchor="middle">同一命名模型层级</text><text x="175" y="168" font-size="10.5" fill="#72757a" text-anchor="middle">one named model</text><rect x="256" y="92" width="164" height="96" rx="10" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.5"/><text x="338.0" y="126" font-size="13" font-weight="700" fill="#202123" text-anchor="middle">中 Medium</text><text x="338.0" y="147" font-size="10.5" fill="#4b4d50" text-anchor="middle">标准推理</text><text x="338.0" y="170" font-size="10.5" fill="#2563eb" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, 'SFMono-Regular', Consolas, monospace">effort = ↑ · 证据 A</text><rect x="432" y="92" width="164" height="96" rx="10" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.5"/><text x="514.0" y="126" font-size="13"