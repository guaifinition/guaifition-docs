<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="system-ui, 'Noto Sans SC', 'Microsoft YaHei', sans-serif" role="img" aria-label="ChatGPT 请求的七层路由与执行链路，从用户控制到配额回退"><rect width="900" height="620" fill="#ffffff"/><defs><marker id="c-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b4d50"/></marker></defs><text x="40" y="34" font-size="16" font-weight="700" fill="#202123">七层路由与执行链路 · The layered routing chain</text><text x="40" y="56" font-size="12" fill="#72757a">“路由”不是单一算法：一条用户消息要穿过至少七个不同的控制面（据 OpenAI 公开资料重构）</text><rect x="60" y="78" width="780" height="66" rx="11" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.5"/><text x="82" y="106" font-size="13.5" font-weight="700" fill="#2563eb">① 用户控制面</text><text x="82" y="128" font-size="10.5" fill="#72757a" font-family="'Cascadia Code', ui-monospace, 'SFMono-Regular', Consolas, monospace">User control</text><text x="260" y="106" font-size="11.5" fill="#4b4d50">选择 极速 / 中 / 高 / 极高，或开启自动切换；工作空间可限制选项</text><rect x="770" y="94" width="52" height="22" rx="11" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/><text x="796" y="109" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, 'SFMono-Regular', Consolas, monospace">A</text><line x1="450.0" y1="144" x2="450.0" y2="154" stroke="#4b4d50" stroke-width="1.6" marker-end="url(#c-arrow)"/><rect x="60" y="154" width="780" height="66" rx="11" fill="#eaf8f1" stroke="#13795b" stroke-width="1.5"/><text x="82" y="182" font-size="13.5" font-weight="700" fill="#13795b">② 产品语义路由</text><text x="82" y="204" font-size="10.5" fill="#72757a" font-family="'Cascadia Code', ui-monospace, 'SFMono-Regular', Consolas, monospace">Semantic routing</text><text x="260" y="182" font-size="11.5" fill="#4b4d50">自动切换时：复杂请求 Instant → Sol Medium（仅此方向已公开）</text><rect x="770" y="170" width="52" height="22" rx="11" fill="#ffffff" stroke="#13795b" stroke-width="1.2"/><text x="796" y="185" font-size="11" font-weight="700" fill="#13795b" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, 'SFMono-Regular', Consolas, monospace">A/B</text><line x1="450.0" y1="220" x2="450.0" y2="230" stroke="#4b4d50" stroke-width="1.6" marker-end="url(#c-arrow)"/><rect x="60" y="230" width="780" height="66" rx="11" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.5"/><text x="82" y="258" font-size="13.5" font-weight="700" fill="#2563eb">③ 模型与推理配置</text><text x="82" y="280" font-size="10.5" fill="#72757a" font-family="'Cascadia Code', ui-monospace, 'SFMono-Regular', Consolas, monospace">Model + effort</text><text x="260" y="258" font-size="11.5" fill="#4b4d50">确定执行模型后施加推理预设：Sol 的 Medium / High / Extra High</text><rect x="770" y="246" width="52" height="22" rx="11" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/><text x="796" y="261" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, 'SFMono-Regular', Consolas, monospace">A</text><line x1="450.0" y1="296" x2="450.0" y2="306" stroke="#4b4d50" stroke-width="1.6" marker-end="url(#c-arrow)"/><rect x="60" y="306" width="780" height="66" rx="11" fill="#f2edff" stroke="#6941c6" stroke-width="1.5"/><text x="82" y="334" font-size="13.5" font-weight="700" fill="#6941c6">④ 工具与智能体编排</text><text x="82" y="356" font-size="10.5" fill="#72757a" font-family="'Cascadia Code', ui-monospace, 'SFMono-Regular', Consolas, monospace">Tool orchestration</text><text x="260" y="334" font-size="11.5" fill="#4b4d50">搜索 / 代码 / 文件 / 计算机使用：一条消息可触发多轮模型+工具调用</text><rect x="770" y="322" width="52" height="22" rx="11" fill="#ffffff" stroke="#6941c6" stroke-width="1.2"/><text x="796" y="337" font-size="11" font-weight="700" fill="#6941c6" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, 'SFMono-Regular', Consolas, monospace">A</text><line x1="450.0" y1="372" x2="450.0" y2="382" stroke="#4b4d50" stroke-width="1.6" marker-end="url(#c-arrow)"/><rect x="60" y="382" width="780" height="66" rx="11" fill="#fff5e2" stroke="#a46108" stroke-width="1.5"/><text x="82" y="410" font-size="13.5" font-weight="700" fill="#a46108">⑤ 安全控制面</text><text x="82" y="432" font-size="10.5" fill="#72757a" font-family="'Cascadia Code', ui-monospace, 'SFMono-Regular', Consolas, monospace">Safety control</text><text x="260" y="410" font-size="11.5" fill="#4b4d50">模型内安全 + 生成中激活分类器 + 实时阻断 + 跨会话检测</text><rect x="770" y="398" width="52" height="22" rx="11" fill="#ffffff" stroke="#a46108" stroke-width="1.2"/><text x="796" y="413" font-size="11" font-weight="700" fill="#a46108" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, 'SFMono-Regular', Consolas, monospace">A</text><line x1="450.0" y1="448" x2="450.0" y2="458" stroke="#4b4d50" stroke-width="1.6" marker-end="url(#c-arrow)"/><rect x="60" y="458" width="780" height="66" rx="11" fill="#f2f2f0" stroke="#72757a" stroke-width="1.5"/><text x="82" y="486" font-size="13.5" font-weight="700" fill="#72757a">⑥ 基础设施路由</text><text x="82" y="508" font-size="10.5" fill="#72757a" font-family="'Cascadia Code', ui-monospace, 'SFMono-Regular', Consolas, monospace">Infra routing</text><text x="260" y="486" font-size="11.5" fill="#4b4d50">按区域、容量、加速器、负载、上下文长度、缓存调度到实例（不改产品语义）</text><rect x="770" y="474" width="52" height="22" rx="11" fill="#ffffff" stroke="#72757a" stroke-width="1.2"/><text x="796" y="489" font-size="11" font-weight="700" fill="#72757a" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, 'SFMono-Regular', Consolas, monospace">A</text><line x1="450.0" y1="524" x2="450.0" y2="534" stroke="#4b4d50" stroke-width="1.6" marker-end="url(#c-arrow)"/><rect x="60" y="534" width="780" height="66" rx="11" fill="#fff5e2" stroke="#a46108" stroke-width="1.5"/><text x="82" y="562" font-size="13.5" font-weight="700" fill="#a46108">⑦ 配额回退</text><text x="82" y="584" font-size="10.5" fill="#72757a" font-family="'Cascadia Code', ui-monospace, 'SFMono-Regular', Consolas, monospace">Quota fallback</text><text x="260" y="562" font-size="11.5" fill="#4b4d50">达到 GPT-5.6 推理限额后，可能改用 GPT-5.4 Thinking mini</text><rect x="770" y="550" width="52" height="22" rx="11" fill="#ffffff" stroke="#a46108" stroke-width="1.2"/><text x="796" y="565" font-size="11" font-weight="700" fill="#a46108" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, 'SFMono-Regular', Consolas, monospace">A</text><text x="40" y="604" font-size="10.5" fill="#72757a">未公开（D）：分类器特征与阈值、每档固定预算、UI→API 枚举映射、参数量 / 是否 MoE。图为控制面重构，非 OpenAI 源码。</text></svg>