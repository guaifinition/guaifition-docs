<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="system-ui, 'Noto Sans SC', 'Microsoft YaHei', sans-serif" role="img" aria-label="隐藏推理 Token：占用上下文、按输出计费、按任务自适应，不是固定计时器"><rect width="900" height="560" fill="#ffffff"/><text x="40" y="34" font-size="16" font-weight="700" fill="#202123">隐藏推理 Token 与自适应软预算 · Hidden reasoning tokens</text><text x="40" y="56" font-size="12" fill="#72757a">推理强度是“软预算”，不是固定秒数或固定 Token 上限；同一档在不同任务上消耗差异极大</text><text x="60" y="84" font-size="13" font-weight="700" fill="#6941c6">A · 一个上下文窗口里装了什么</text><rect x="60" y="92" width="360" height="300" rx="12" fill="none" stroke="#e7e6e3" stroke-width="1.5"/><rect x="72" y="104.0" width="336" height="76.8" rx="7" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.4"/><text x="86" y="126.0" font-size="12" font-weight="700" fill="#2563eb">输入 Token</text><text x="86" y="144.0" font-size="10" fill="#4b4d50">提示 · 历史 · 系统指令 · 工具定义 · 附件</text><rect x="72" y="186.8" width="336" height="109.9" rx="7" fill="#f2edff" stroke="#6941c6" stroke-width="1.4"/><text x="86" y="208.8" font-size="12" font-weight="700" fill="#6941c6">隐藏推理 Token</text><text x="86" y="226.8" font-size="10" fill="#4b4d50">不展示原文 · 占上下文 · 按输出 Token 计费</text><rect x="72" y="302.7" width="336" height="38.2" rx="7" fill="#eaf8f1" stroke="#13795b" stroke-width="1.4"/><text x="86" y="324.7" font-size="12" font-weight="700" fill="#13795b">工具返回 / 网页内容</text><text x="86" y="342.7" font-size="10" fill="#4b4d50">搜索结果 · 文件 · 代码执行输出</text><rect x="72" y="346.9" width="336" height="27.1" rx="7" fill="#fff5e2" stroke="#a46108" stroke-width="1.4"/><text x="86" y="368.9" font-size="12" font-weight="700" fill="#a46108">可见输出 Token</text><text x="86" y="386.9" font-size="10" fill="#4b4d50">最终答案 · 可选推理摘要</text><text x="60" y="414" font-size="10" fill="#72757a">比例仅为示意，非 GPT-5.6 实测数据。隐藏推理可从数百到数万 Token（A，API 披露）。</text><text x="470" y="84" font-size="13" font-weight="700" fill="#2563eb">B · 每档是分布，不是固定值</text><rect x="470" y="92" width="380" height="300" rx="12" fill="none" stroke="#e7e6e3" stroke-width="1.5"/><line x1="510" y1="116" x2="510" y2="346" stroke="#e7e6e3" stroke-width="1.2"/><line x1="510" y1="346" x2="830" y2="346" stroke="#e7e6e3" stroke-width="1.2"/><text x="504" y="114" font-size="9.5" fill="#72757a" text-anchor="end">概率</text><text x="830" y="362" font-size="9.5" fill="#72757a" text-anchor="end">推理 Token 数 →</text><polyline points="515.0,333.2 520.2,330.6 525.3,327.5 530.5,324.2 535.7,320.4 540.8,316.4 546.0,312.1 551.2,307.6 556.3,303.0 561.5,298.3 566.7,293.7 571.8,289.3 577.0,285.1 582.2,281.4 587.3,278.2 592.5,275.5 597.7,273.6 602.8,272.4 608.0,272.0 613.2,272.4 618.3,273.6 623.5,275.5 628.7,278.2 633.8,281.4 639.0,285.1 644.2,289.3 649.3,293.7 654.5,298.3 659.7,303.0 664.8,307.6 670.0,312.1 675.2,316.4 680.3,320.4 685.5,324.2 690.7,327.5 695.8,330.6 701.0,333.2 706.2,335.6 711.3,337.6 716.5,339.2 721.7,340.6 726.8,341.8 732.0,342.7 737.2,343.5 742.3,344.1 747.5,344.6 752.7,344.9 757.8,345.2 763.0,345.4 768.2,345.6 773.3,345.7 778.5,345.8 783.7,345.9 788.8,345.9 794.0,345.9 799.2,346.0 804.3,346.0 809.5,346.0 814.7,346.0 819.8,346.0 825.0,346.0" fill="none" stroke="#2563eb" stroke-width="2"/><line x1="608.0" y1="346" x2="608.0" y2="272.0" stroke="#2563eb" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/><polyline points="515.0,345.7 520.2,345.6 525.3,345.4 530.5,345.2 535.7,345.0 540.8,344.6 546.0,344.2 551.2,343.6 556.3,342.9 561.5,342.0 566.7,340.9 571.8,339.7 577.0,338.2 582.2,336.4 587.3,334.3 592.5,332.0 597.7,329.4 602.8,326.6 608.0,323.5 613.2,320.1 618.3,316.6 623.5,313.0 628.7,309.4 633.8,305.7 639.0,302.2 644.2,298.9 649.3,295.9 654.5,293.3 659.7,291.1 664.8,289.5 670.0,288.5 675.2,288.0 680.3,288.2 685.5,289.0 690.7,290.4 695.8,292.4 701.0,294.8 706.2,297.7 711.3,300.9 716.5,304.3 721.7,307.9 726.8,311.6 732.0,315.2 737.2,318.8 742.3,322.2 747.5,325.4 752.7,328.3 757.8,331.0 763.0,333.5 768.2,335.6 773.3,337.5 778.5,339.1 783.7,340.5 788.8,341.6 794.0,342.5 799.2,343.3 804.3,343.9 809.5,344.4 814.7,344.8 819.8,345.1 825.0,345.4" fill="none" stroke="#6941c6" stroke-width="2"/><line x1="676.2" y1="346" x2="676.2" y2="288.0" stroke="#6941c6" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/><polyline points="515.0,346.0 520.2,346.0 525.3,346.0 530.5,346.0 535.7,346.0 540.8,346.0 546.0,346.0 551.2,346.0 556.3,346.0 561.5,345.9 566.7,345.9 571.8,345.9 577.0,345.8 582.2,345.8 587.3,345.7 592.5,345.6 597.7,345.4 602.8,345.2 608.0,345.0 613.2,344.6 618.3,344.2 623.5,343.6 628.7,343.0 633.8,342.2 639.0,341.2 644.2,340.0 649.3,338.7 654.5,337.1 659.7,335.3 664.8,333.3 670.0,331.1 675.2,328.6 680.3,326.0 685.5,323.3 690.7,320.4 695.8,317.5 701.0,314.6 706.2,311.8 711.3,309.2 716.5,306.7 721.7,304.6 726.8,302.8 732.0,301.4 737.2,300.5 742.3,300.0 747.5,300.1 752.7,300.6 757.8,301.7 763.0,303.1 768.2,305.0 773.3,307.2 778.5,309.7 783.7,312.4 788.8,315.2 794.0,318.1 799.2,321.0 804.3,323.8 809.5,326.6 814.7,329.1 819.8,331.5 825.0,333.7" fill="none" stroke="#a46108" stroke-width="2"/><line x1="744.4" y1="346" x2="744.4" y2="300.0" stroke="#a46108" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/><rect x="510" y="360" width="14" height="10" rx="2" fill="#2563eb"/><text x="530" y="369" font-size="10.5" fill="#4b4d50">中 Medium</text><rect x="630" y="360" width="14" height="10" rx="2" fill="#6941c6"/><text x="650" y="369" font-size="10.5" fill="#4b4d50">高 High</text><rect x="750" y="360" width="14" height="10" rx="2" fill="#a46108"/><text x="770" y="369" font-size="10.5" fill="#4b4d50">极高 Extra High</text><text x="482" y="414" font-size="10" fill="#72757a">更高强度把分布右移、拉宽；均值可能上升，但每次采样实际值不固定（A/B）。</text><rect x="60" y="430" width="790" height="96" rx="12" fill="#eaf8f1" stroke="#13795b" stroke-width="1.3"/><text x="80" y="458" font-size="12.5" font-weight="700" fill="#13795b">三条不可回避的事实（均为官方 A 级披露）</text><text x="80" y="482" font-size="11" fill="#202123">· 隐藏推理 Token 不向用户展示，但仍占用上下文窗口。</text><text x="80" y="502" font-size="11" fill="#202123">· 在 API 中按输出 Token 计费（output_tokens_details.reasoning_tokens）。</text><text x="80" y="522" font-size="11" fill="#202123">· 按任务难度自适应：简单任务少思考，复杂任务多思考——不是固定计时器。</text></svg>