<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="system-ui, 'Noto Sans SC', 'Microsoft YaHei', sans-serif" role="img" aria-label="安全检查点时间线：steer 落在下一个边界，以及 L_steer 的延迟分解"><rect width="900" height="470" fill="#ffffff"/><defs><marker id="sc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b4d50"/></marker></defs><text x="40" y="34" font-size="16" font-weight="700" fill="#202123">安全检查点时间线 · Where Steer Lands</text><text x="40" y="56" font-size="12" fill="#72757a">L_steer = ingress + checkpoint + replan；可唤醒的等待让 checkpoint 坍缩，Codex 因此“感觉更快”</text><rect x="93.0" y="133.0" width="54" height="34" rx="6" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.3"/><text x="120" y="154" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, 'SFMono-Regular', Consolas, monospace">M1</text><rect x="223.0" y="133.0" width="54" height="34" rx="6" fill="#f2f2f0" stroke="#202123" stroke-width="1.3"/><text x="250" y="154" font-size="11" font-weight="700" fill="#202123" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, 'SFMono-Regular', Consolas, monospace">T1</text><path d="M 360 133 L 375 150 L 360 167 L 345 150 Z" fill="#eaf8f1" stroke="#13795b" stroke-width="1.8"/><text x="360" y="154" font-size="11" font-weight="700" fill="#13795b" text-anchor="middle">B</text><text x="360" y="120" font-size="10.5" fill="#13795b" text-anchor="middle">安全检查点</text><rect x="453.0" y="133.0" width="54" height="34" rx="6" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.3"/><text x="480" y="154" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, 'SFMono-Regular', Consolas, monospace">M2</text><rect x="583.0" y="133.0" width="54" height="34" rx="6" fill="#f2f2f0" stroke="#202123" stroke-width="1.3"/><text x="610" y="154" font-size="11" font-weight="700" fill="#202123" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, 'SFMono-Regular', Consolas, monospace">T2</text><rect x="713.0" y="133.0" width="54" height="34" rx="6" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.3"/><text x="740" y="154" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, 'SFMono-Regular', Consolas, monospace">M3</text><line x1="147" y1="150" x2="223" y2="150" stroke="#72757a" stroke-width="1.5" marker-end="url(#sc-arrow)"/><line x1="277" y1="150" x2="343" y2="150" stroke="#72757a" stroke-width="1.5" marker-end="url(#sc-arrow)"/><line x1="377" y1="150" x2="453" y2="150" stroke="#13795b" stroke-width="1.5" marker-end="url(#sc-arrow)"/><line x1="507" y1="150" x2="583" y2="150" stroke="#72757a" stroke-width="1.5" marker-end="url(#sc-arrow)"/><line x1="637" y1="150" x2="713" y2="150" stroke="#72757a" stroke-width="1.5" marker-end="url(#sc-arrow)"/><text x="250" y="94" font-size="11" font-weight="700" fill="#6941c6" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, 'SFMono-Regular', Consolas, monospace">新输入 x 于时刻 t</text><line x1="250" y1="102" x2="250" y2="130" stroke="#6941c6" stroke-width="1.6" marker-end="url(#sc-arrow)"/><path d="M 250 108 H 360 V 130" fill="none" stroke="#6941c6" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="250" y1="176" x2="250" y2="220" stroke="#72757a" stroke-width="1" stroke-dasharray="3 3"/><line x1="480" y1="176" x2="480" y2="220" stroke="#72757a" stroke-width="1" stroke-dasharray="3 3"/><rect x="250" y="228" width="40" height="26" rx="6" fill="#6941c6" opacity="0.16"/><line x1="250" y1="228" x2="250" y2="254" stroke="#6941c6" stroke-width="1.2"/><text x="270.0" y="245" font-size="10.5" font-weight="700" fill="#6941c6" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, 'SFMono-Regular', Consolas, monospace">ingress</text><rect x="290" y="228" width="70" height="26" rx="6" fill="#a46108" opacity="0.16"/><line x1="290" y1="228" x2="290" y2="254" stroke="#a46108" stroke-width="1.2"/><text x="325.0" y="245" font-size="10.5" font-weight="700" fill="#a46108" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, 'SFMono-Regular', Consolas, monospace">checkpoint</text><rect x="360" y="228" width="120" height="26" rx="6" fill="#2563eb" opacity="0.16"/><line x1="360" y1="228" x2="360" y2="254" stroke="#2563eb" stroke-width="1.2"/><text x="420.0" y="245" font-size="10.5" font-weight="700" fill="#2563eb" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, 'SFMono-Regular', Consolas, monospace">replan</text><text x="250" y="274" font-size="11" fill="#4b4d50">L_steer = L_ingress + L_checkpoint + L_replan  ·  本地 CLI 里 ingress 很小，checkpoint 通常主导</text><rect x="40" y="306" width="820" height="72" rx="11" fill="#eaf8f1" stroke="#13795b" stroke-width="1.4"/><text x="58" y="330" font-size="12.5" font-weight="700" fill="#13795b">可唤醒等待 · sleep / wait_agent（tokio::select!）</text><text x="58" y="351" font-size="11" fill="#4b4d50">等待型工具同时监听“计时结束”与“input activity”：新输入一到即提前返回 → L_checkpoint ≈ 0</text><text x="58" y="369" font-size="11" fill="#4b4d50">对比：sleep(固定时间) → 轮询队列 → 再 sleep 的被动等待，尾延迟高得多</text></svg>