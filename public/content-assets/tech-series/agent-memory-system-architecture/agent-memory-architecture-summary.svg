<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070b14" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardGradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cardGradTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cardGradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="blueGlowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadowEffect" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#bgGlow)" />

  <!-- Geometric Grid Pattern -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" />
    <path d="M100,0 V675 M200,0 V675 M300,0 V675 M400,0 V675 M500,0 V675 M600,0 V675 M700,0 V675 M800,0 V675 M900,0 V675 M1000,0 V675 M1100,0 V675" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="250" cy="330" r="180" fill="#3b82f6" opacity="0.08" filter="url(#glowEffect)"/>
  <circle cx="600" cy="350" r="220" fill="#6366f1" opacity="0.1" filter="url(#glowEffect)"/>
  <circle cx="950" cy="330" r="180" fill="#14b8a6" opacity="0.08" filter="url(#glowEffect)"/>

  <!-- Top Title Banner -->
  <g transform="translate(600, 55)" text-anchor="middle">
    <rect x="-320" y="-22" width="640" height="44" rx="22" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1.2"/>
    <text y="6" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5">AGENT MEMORY ARCHITECTURE · HUGGING FACE &amp; MEM0</text>
    <text y="48" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="0.5">大语言模型智能体长期记忆架构与混合重排体系</text>
  </g>

  <!-- Left: Ingestion Pipeline Column -->
  <g transform="translate(60, 150)" filter="url(#shadowEffect)">
    <!-- Column Card Box -->
    <rect width="320" height="430" rx="16" fill="url(#cardGradBlue)" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="48" rx="16" fill="#1e3a8a" fill-opacity="0.6"/>
    
    <!-- Title -->
    <circle cx="28" cy="24" r="8" fill="#38bdf8"/>
    <text x="46" y="29" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">1. 记忆摄入 (Ingestion)</text>
    
    <!-- Step 1: Dialogue Context Input -->
    <g transform="translate(20, 65)">
      <rect width="280" height="68" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" fill="#93c5fd" font-size="12" font-weight="700">上下文与对话输入</text>
      <text x="14" y="44" fill="#94a3b8" font-size="11">汇集 User Summary + 最近 10 条交互</text>
      <text x="14" y="58" fill="#64748b" font-size="10">支撑上下文感知与前置指代消解</text>
    </g>

    <!-- Connector Arrow 1 -->
    <path d="M160, 138 V152" stroke="#60a5fa" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="160,156 156,148 164,148" fill="#60a5fa"/>

    <!-- Step 2: LLM Structured Extraction -->
    <g transform="translate(20, 160)">
      <rect width="280" height="80" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2"/>
      <text x="14" y="24" fill="#60a5fa" font-size="12" font-weight="700">LLM 事实抽取 (infer=True)</text>
      <text x="14" y="44" fill="#e2e8f0" font-size="11">轻量模型 (Qwen2.5/Llama3.1) 输出 JSON</text>
      <text x="14" y="60" fill="#94a3b8" font-size="10">• 代词消解: "它/他" → 具象实体</text>
      <text x="14" y="73" fill="#94a3b8" font-size="10">• 提炼原子事实 (Atomic Facts)</text>
    </g>

    <!-- Connector Arrow 2 -->
    <path d="M160, 245 V259" stroke="#60a5fa" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="160,263 156,255 164,255" fill="#60a5fa"/>

    <!-- Step 3: Deduplication & Lemmatization -->
    <g transform="translate(20, 267)">
      <rect width="280" height="74" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" fill="#93c5fd" font-size="12" font-weight="700">去重校验与词元化</text>
      <text x="14" y="44" fill="#cbd5e1" font-size="11">• SHA-1 / 哈希精确去重</text>
      <text x="14" y="60" fill="#cbd5e1" font-size="11">• Spacy/NLTK Lemmas 词形还原</text>
    </g>

    <!-- Step 4: Storage Dispatch -->
    <g transform="translate(20, 354)">
      <rect width="280" height="58" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="14" y="24" fill="#38bdf8" font-size="12" font-weight="700">并发写入三层存储中枢 ➔</text>
      <text x="14" y="44" fill="#94a3b8" font-size="11">同步持久化至主向量库/实体库/SQLite</text>
    </g>
  </g>

  <!-- Center: Multi-Tier Storage Hub -->
  <g transform="translate(440, 150)" filter="url(#shadowEffect)">
    <!-- Column Card Box -->
    <rect width="320" height="430" rx="16" fill="url(#cardGradPurple)" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="48" rx="16" fill="#4c1d95" fill-opacity="0.6"/>
    
    <!-- Title -->
    <circle cx="28" cy="24" r="8" fill="#c084fc"/>
    <text x="46" y="29" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">2. 混合存储中枢 (Storage)</text>

    <!-- Storage Tier 1: Main Vector Store -->
    <g transform="translate(20, 65)">
      <rect width="280" height="102" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
      <text x="14" y="24" fill="#c084fc" font-size="12" font-weight="700">主记忆向量库 (Main Vector DB)</text>
      <text x="14" y="44" fill="#e2e8f0" font-size="11">• 原子事实向量 (Dense Embedding)</text>
      <text x="14" y="60" fill="#cbd5e1" font-size="10">• 元数据: TTL、时间戳、归属标记</text>
      <text x="14" y="76" fill="#cbd5e1" font-size="10">• 词元还原文本 (Lemmas for BM25)</text>
      <text x="14" y="92" fill="#94a3b8" font-size="10">• 存储引擎: Qdrant / Chroma / LanceDB</text>
    </g>

    <!-- Storage Tier 2: Entity Graph Store -->
    <g transform="translate(20, 180)">
      <rect width="280" height="102" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
      <text x="14" y="24" fill="#d8b4fe" font-size="12" font-weight="700">实体记忆库 (Entity Store)</text>
      <text x="14" y="44" fill="#e2e8f0" font-size="11">• 命名实体 (Named Entities) 向量</text>
      <text x="14" y="60" fill="#cbd5e1" font-size="10">• 实体-事实双向指针映射表</text>
      <text x="14" y="76" fill="#cbd5e1" font-size="10">• 支撑关联知识图谱多跳检索</text>
      <text x="14" y="92" fill="#94a3b8" font-size="10">• 特异度计算 (反比加权依据)</text>
    </g>

    <!-- Storage Tier 3: SQLite Store -->
    <g transform="translate(20, 295)">
      <rect width="280" height="115" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" fill="#94a3b8" font-size="12" font-weight="700">SQLite 状态与审计库</text>
      <text x="14" y="44" fill="#e2e8f0" font-size="11">• 最近 10 条原始交互消息缓冲区</text>
      <text x="14" y="60" fill="#cbd5e1" font-size="10">• 全量记忆增删改审计历史 (Audit)</text>
      <text x="14" y="76" fill="#cbd5e1" font-size="10">• 用户与 Agent 权限映射</text>
      <text x="14" y="94" fill="#64748b" font-size="10">• 轻量单文件嵌入式部署</text>
    </g>
  </g>

  <!-- Right: Retrieval & Reranking Column -->
  <g transform="translate(820, 150)" filter="url(#shadowEffect)">
    <!-- Column Card Box -->
    <rect width="320" height="430" rx="16" fill="url(#cardGradTeal)" stroke="#14b8a6" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="48" rx="16" fill="#134e4a" fill-opacity="0.6"/>
    
    <!-- Title -->
    <circle cx="28" cy="24" r="8" fill="#2dd4bf"/>
    <text x="46" y="29" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">3. 混合检索与重排 (Reranking)</text>

    <!-- Phase 1: Broad ANN Recall -->
    <g transform="translate(20, 65)">
      <rect width="280" height="68" rx="10" fill="#0f172a" stroke="#0d9488" stroke-width="1"/>
      <text x="14" y="24" fill="#2dd4bf" font-size="12" font-weight="700">粗排候选池初筛 (ANN Recall)</text>
      <text x="14" y="44" fill="#e2e8f0" font-size="11">• 候选规模: max(TopK × 4, 60)</text>
      <text x="14" y="58" fill="#94a3b8" font-size="10">• 确保足够覆盖度供精排筛选</text>
    </g>

    <!-- Connector Arrow 3 -->
    <path d="M160, 138 V152" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="160,156 156,148 164,148" fill="#2dd4bf"/>

    <!-- Phase 2: Hybrid Scoring Formula -->
    <g transform="translate(20, 160)">
      <rect width="280" height="135" rx="10" fill="#0f172a" stroke="#14b8a6" stroke-width="1.2"/>
      <text x="14" y="22" fill="#5eead4" font-size="12" font-weight="700">三路融合打分公式</text>
      <!-- Formula Display -->
      <rect x="14" y="32" width="252" height="30" rx="6" fill="#134e4a" fill-opacity="0.4"/>
      <text x="140" y="52" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle" font-family="'Courier New', monospace">Score = (S_vec + S_bm25 + S_ent) / 2.5</text>
      <text x="14" y="80" fill="#cbd5e1" font-size="10">• S_vec ∈ [0, 1.0]: 向量语义余弦相似度</text>
      <text x="14" y="96" fill="#cbd5e1" font-size="10">• S_bm25 ∈ [0, 1.0]: Query与Lemma词法匹配</text>
      <text x="14" y="112" fill="#cbd5e1" font-size="10">• S_ent ∈ [0, 0.5]: 实体特异度加权增益</text>
    </g>

    <!-- Connector Arrow 4 -->
    <path d="M160, 300 V314" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="160,318 156,310 164,310" fill="#2dd4bf"/>

    <!-- Phase 3: Final Selection & Prompt Injection -->
    <g transform="translate(20, 322)">
      <rect width="280" height="90" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" fill="#2dd4bf" font-size="12" font-weight="700">归一化重排与 Prompt 注入</text>
      <text x="14" y="44" fill="#e2e8f0" font-size="11">• 综合评分降序排列并按阈值截断</text>
      <text x="14" y="60" fill="#cbd5e1" font-size="10">• 精确提取 Top-K 原子事实记忆</text>
      <text x="14" y="76" fill="#94a3b8" font-size="10">• 注入 Agent System Prompt 产生响应</text>
    </g>
  </g>

  <!-- Linking Connecting Pipes between Columns -->
  <!-- Pipe 1: Left to Center (Ingestion to Storage) -->
  <path d="M380, 480 C 410, 480 410, 480 440, 480" stroke="url(#blueGlowLine)" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  
  <!-- Pipe 2: Center to Right (Storage to Retrieval) -->
  <path d="M760, 200 C 790, 200 790, 200 820, 200" stroke="url(#blueGlowLine)" stroke-width="2" stroke-dasharray="4,4" fill="none"/>

  <!-- Bottom Footer Info Bar -->
  <g transform="translate(60, 600)">
    <rect width="1080" height="52" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
    <text x="24" y="31" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">
      <tspan fill="#38bdf8" font-weight="700">跨 Agent 共享架构：</tspan>
      以用户全局 user_id 为中心解耦存储 · 支持 ChatGPT / Claude / 本地开源模型 (Qwen2.5 / Llama3.1) 统一访问
    </text>
    <text x="1056" y="31" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" text-anchor="end">
      Hugging Face Technical Architecture Report · 2026
    </text>
  </g>
</svg>
