<svg xmlns="http://www.w3.org/2000/svg" width="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 900 360" role="img" aria-label="AlphaGo到AlphaGo Zero和AlphaZero演化图">
              <defs><marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#61768a"></path></marker></defs>
              <g font-family="Microsoft YaHei">
                <rect x="40" y="70" width="235" height="210" rx="8" fill="#edf4fa" stroke="#4f7699"></rect>
                <text x="157" y="108" text-anchor="middle" font-size="19" fill="#264d70">AlphaGo (2016)</text>
                <text x="65" y="145" font-size="13" fill="#4b5f72">• 人类专家棋谱</text>
                <text x="65" y="174" font-size="13" fill="#4b5f72">• 人工围棋特征</text>
                <text x="65" y="203" font-size="13" fill="#4b5f72">• SL / RL policy 分离</text>
                <text x="65" y="232" font-size="13" fill="#4b5f72">• 独立 value network</text>
                <text x="65" y="261" font-size="13" fill="#4b5f72">• Monte Carlo rollout</text>

                <rect x="335" y="70" width="235" height="210" rx="8" fill="#edf7f2" stroke="#4f826e"></rect>
                <text x="452" y="108" text-anchor="middle" font-size="19" fill="#2e5b4a">AlphaGo Zero (2017)</text>
                <text x="360" y="145" font-size="13" fill="#4f675d">• 仅使用游戏规则</text>
                <text x="360" y="174" font-size="13" fill="#4f675d">• 完全 self-play</text>
                <text x="360" y="203" font-size="13" fill="#4f675d">• 单一 policy-value 网络</text>
                <text x="360" y="232" font-size="13" fill="#4f675d">• 无 rollout</text>
                <text x="360" y="261" font-size="13" fill="#4f675d">• Residual network + MCTS</text>

                <rect x="630" y="70" width="225" height="210" rx="8" fill="#f7f1ea" stroke="#8b6c4a"></rect>
                <text x="742" y="108" text-anchor="middle" font-size="19" fill="#634a31">AlphaZero</text>
                <text x="655" y="145" font-size="13" fill="#6a5b4c">• 通用 self-play 框架</text>
                <text x="655" y="174" font-size="13" fill="#6a5b4c">• Chess</text>
                <text x="655" y="203" font-size="13" fill="#6a5b4c">• Shogi</text>
                <text x="655" y="232" font-size="13" fill="#6a5b4c">• Go</text>
                <text x="655" y="261" font-size="13" fill="#6a5b4c">• 更少领域专用知识</text>

                <line x1="275" y1="175" x2="335" y2="175" stroke="#61768a" stroke-width="2" marker-end="url(#arr4)"></line>
                <line x1="570" y1="175" x2="630" y2="175" stroke="#61768a" stroke-width="2" marker-end="url(#arr4)"></line>
                <text x="305" y="156" text-anchor="middle" font-size="11" fill="#65717d">简化</text>
                <text x="600" y="156" text-anchor="middle" font-size="11" fill="#65717d">泛化</text>
              </g>
            </svg>